# 청년지원금 앱이 읽을 자료를 하루 한 번 새로 만든다.
#
# ## 왜 있나
# 앱이 온통청년 API 를 직접 부르던 것을 여기로 옮겼다. 그래야
#   - 자료가 이상할 때 **앱을 새로 내지 않고** 여기서 고칠 수 있고
#   - API 키가 앱 안에 안 들어가고
#   - 앱이 받는 양이 1MB 에서 100KB 로 준다.
#
# ## 손으로 돌리고 싶을 때
# GitHub 저장소 → Actions 탭 → 왼쪽에서 이 워크플로 선택 → 오른쪽 'Run workflow'.
# 자료가 이상하다는 제보를 받으면 `tools/jiwon/build.mjs` 를 고치고 이렇게 돌리면
# 몇 분 만에 모든 사용자에게 반영된다.

name: 청년지원금 자료 만들기

on:
  schedule:
    # 매일 한국시간 새벽 4시 30분 (UTC 19:30). 사람이 안 쓰는 시간에 돈다.
    # 정각을 피한 것은 그때 깃허브에 작업이 몰려 밀리기 때문이다.
    - cron: '30 19 * * *'
  workflow_dispatch: # 손으로도 돌릴 수 있게

# 만든 자료를 이 저장소에 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

# 앞의 실행이 아직 돌고 있으면 기다린다. 두 개가 같이 커밋하면 부딪친다.
concurrency:
  group: jiwon-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 자료 만들기
        env:
          YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
        run: node tools/jiwon/build.mjs

      - name: 제대로 만들어졌는지 확인
        # 여기서 막아야 한다. 빈 파일이나 깨진 파일을 커밋하면 앱이 그걸 받는다.
        run: node tools/jiwon/check.mjs

      - name: 바뀌었으면 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jiwon/data
          if git diff --staged --quiet; then
            echo "바뀐 것이 없다. 커밋 안 한다."
          else
            git commit -m "청년지원금 자료 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
